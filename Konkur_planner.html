<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>مسیر کنکور</title>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مسیر کنکور">
<meta name="theme-color" content="#6FA05C">

<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236FA05C'/%3E%3Cpath d='M25 52 L42 68 L75 30' stroke='white' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F6EC;
    --surface:#FFFFFF;
    --surface-soft:#FBFCF7;
    --text:#2B3A28;
    --text-muted:#75836C;
    --line:#E3E9D6;

    --spring-1:#6FA05C; --spring-2:#EE9FB6; --spring-bg:#EAF3E4;
    --summer-1:#DE9E33; --summer-2:#4EA3C7; --summer-bg:#FBF1E0;
    --autumn-1:#BD8138; --autumn-2:#8C4B57; --autumn-bg:#F5ECDF;
    --winter-1:#5C7CA3; --winter-2:#B7C4DA; --winter-bg:#EAEFF6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Vazirmatn', Tahoma, 'Segoe UI', sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    padding-bottom:48px;
  }

  /* ---------- Header ---------- */
  .hero{
    padding:28px 20px 22px;
    color:#fff;
    border-radius:0 0 28px 28px;
    position:relative;
    overflow:hidden;
  }
  .hero-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .year-switch{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .year-switch button{
    background:rgba(255,255,255,0.22);
    border:none;
    color:#fff;
    width:30px;height:30px;
    border-radius:50%;
    font-size:16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    line-height:1;
  }
  .year-switch button:active{ transform:scale(0.92); }
  .year-label{
    font-size:15px;
    font-weight:600;
    letter-spacing:0.5px;
  }
  .hero-title{
    margin:18px 0 4px;
    font-size:26px;
    font-weight:800;
  }
  .hero-sub{
    font-size:13.5px;
    opacity:0.9;
    font-weight:400;
    margin-bottom:18px;
  }
  .season-bar{
    display:flex;
    gap:4px;
    height:10px;
    border-radius:6px;
    overflow:hidden;
    background:rgba(255,255,255,0.25);
  }
  .season-bar > div{ height:100%; }
  .season-bar-labels{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    margin-top:8px;
    opacity:0.9;
  }
  .stat-row{
    display:flex;
    gap:10px;
    margin-top:16px;
  }
  .stat-chip{
    background:rgba(255,255,255,0.18);
    border-radius:14px;
    padding:8px 14px;
    font-size:12.5px;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .stat-chip b{ font-size:16px; }

  /* ---------- Seasons ---------- */
  .seasons{ padding:20px 16px 0; }
  .season-block{ margin-bottom:22px; }
  .season-head{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    padding:0 2px;
  }
  .season-head svg{ width:20px; height:20px; }
  .season-head span{
    font-size:14.5px;
    font-weight:600;
    color:var(--text);
  }
  .month-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .month-card{
    background:var(--surface);
    border-radius:16px;
    padding:14px 8px 12px;
    text-align:center;
    cursor:pointer;
    border:1px solid var(--line);
    transition:transform .15s ease;
  }
  .month-card:active{ transform:scale(0.95); }
  .month-card .m-name{
    font-size:13px;
    font-weight:600;
    margin-bottom:8px;
  }
  .ring{
    width:44px;height:44px;
    margin:0 auto 6px;
    position:relative;
  }
  .ring svg{ transform:rotate(-90deg); }
  .ring-track{ fill:none; stroke:var(--line); stroke-width:4; }
  .ring-fill{ fill:none; stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset .4s ease; }
  .ring-text{
    position:absolute; inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:10.5px; font-weight:600; color:var(--text-muted);
  }
  .m-frac{ font-size:11px; color:var(--text-muted); }

  /* ---------- Month view ---------- */
  .month-view{ display:none; padding:16px 16px 8px; }
  .month-header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .back-btn{
    width:36px;height:36px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:16px;
    flex-shrink:0;
  }
  .back-btn:active{ transform:scale(0.9); }
  .month-title{
    font-size:19px;
    font-weight:700;
  }
  .month-progress-wrap{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:12px 16px;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .month-progress-track{
    flex:1;
    height:8px;
    border-radius:5px;
    background:var(--line);
    overflow:hidden;
  }
  .month-progress-fill{
    height:100%;
    border-radius:5px;
    transition:width .3s ease;
  }
  .month-progress-num{
    font-size:12.5px;
    color:var(--text-muted);
    white-space:nowrap;
  }

  /* ---------- Day card (multiple goals) ---------- */
  .day-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 12px 8px;
    margin-bottom:10px;
    position:relative;
  }
  .day-card.today{
    border-color:var(--accent-1, #6FA05C);
    box-shadow:0 0 0 1px var(--accent-1, #6FA05C) inset;
  }
  .today-badge{
    position:absolute;
    top:-8px;
    left:10px;
    background:var(--accent-1,#6FA05C);
    color:#fff;
    font-size:9.5px;
    padding:2px 7px;
    border-radius:8px;
    font-weight:600;
  }
  .day-card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .day-num{
    font-weight:700;
    font-size:14px;
    color:var(--text-muted);
  }
  .day-card.today .day-num{ color:var(--accent-1,#6FA05C); }
  .day-frac{
    font-size:11px;
    color:var(--text-muted);
    background:var(--bg);
    border-radius:8px;
    padding:2px 8px;
  }
  .goal-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:5px 0;
  }
  .goal-input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:inherit;
    font-size:13.5px;
    color:var(--text);
    padding:2px 0;
    min-width:0;
  }
  .goal-input::placeholder{ color:#B7C2AE; }
  .goal-input.done-text{
    text-decoration:line-through;
    color:var(--text-muted);
  }
  .check-btn{
    width:24px;height:24px;
    border-radius:50%;
    border:2px solid var(--line);
    flex-shrink:0;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:#fff;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .15s ease, border-color .15s ease;
  }
  .check-btn svg{ width:13px;height:13px; opacity:0; transition:opacity .12s ease; }
  .check-btn.checked{
    background:var(--accent-1,#6FA05C);
    border-color:var(--accent-1,#6FA05C);
    transform:scale(1.08);
  }
  .check-btn.checked svg{ opacity:1; }
  .check-btn.pop{ animation:pop .32s ease; }
  @keyframes pop{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.35); }
    100%{ transform:scale(1.08); }
  }
  .goal-remove{
    width:20px;height:20px;
    flex-shrink:0;
    border:none;
    background:none;
    color:#C7D0BC;
    font-size:15px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .goal-remove:active{ color:#96A488; }
  .add-goal-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 0 4px;
    border-top:1px dashed var(--line);
    margin-top:2px;
  }
  .add-goal-icon{
    width:24px;height:24px;
    border-radius:50%;
    border:1.5px dashed #C7D0BC;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:#96A488;
    font-size:14px;
  }
  .add-goal-input{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:inherit;
    font-size:13px;
    color:var(--text);
    min-width:0;
  }
  .add-goal-input::placeholder{ color:#B7C2AE; }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--text);
    color:#fff;
    padding:10px 20px;
    border-radius:20px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    max-width:80%;
    text-align:center;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div id="app">

  <div class="hero" id="hero">
    <div class="hero-top">
      <div class="year-switch">
        <button id="yearNext" aria-label="سال بعد">‹</button>
        <span class="year-label" id="yearLabel">۱۴۰۵</span>
        <button id="yearPrev" aria-label="سال قبل">›</button>
      </div>
      <div style="font-size:12px; opacity:0.85;" id="todayLabel"></div>
    </div>
    <div class="hero-title">مسیر کنکور</div>
    <div class="hero-sub">هر روز چند هدف کوچیک، یه قدم نزدیک‌تر به مسیر</div>
    <div class="season-bar" id="seasonBar"></div>
    <div class="season-bar-labels">
      <span>بهار</span><span>تابستان</span><span>پاییز</span><span>زمستان</span>
    </div>
    <div class="stat-row">
      <div class="stat-chip"><b id="statDone">۰</b><span>روز کامل شده</span></div>
      <div class="stat-chip"><b id="statGoals">۰</b><span>هدف ثبت‌شده</span></div>
    </div>
  </div>

  <div class="seasons" id="seasons"></div>

  <div class="month-view" id="monthView">
    <div class="month-header">
      <div class="back-btn" id="backBtn">→</div>
      <div class="month-title" id="monthTitle">فروردین</div>
    </div>
    <div class="month-progress-wrap">
      <div class="month-progress-track"><div class="month-progress-fill" id="monthProgressFill"></div></div>
      <div class="month-progress-num" id="monthProgressNum">۰/۳۱</div>
    </div>
    <div id="dayList"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
(function(){

/* ================= Jalaali calendar core (standard algorithm) ================= */
function div(a,b){ return ~~(a/b); }
function mod(a,b){ return a - ~~(a/b)*b; }

function g2d(gy,gm,gd){
  var d = div((gy + div(gm-8,6) + 100100) * 1461, 4)
    + div(153*mod(gm+9,12)+2, 5)
    + gd - 34840408;
  d = d - div(div(gy+100100+div(gm-8,6),100)*3,4) + 752;
  return d;
}
function d2g(jdn){
  var j = 4*jdn + 139361631;
  j = j + div(div(4*jdn+183187720,146097)*3,4)*4 - 3908;
  var i = div(mod(j,1461),4)*5 + 308;
  var gd = div(mod(i,153),5) + 1;
  var gm = mod(div(i,153),12) + 1;
  var gy = div(j,1461) - 100100 + div(8-gm,6);
  return {gy:gy,gm:gm,gd:gd};
}
function jalCal(jy){
  var breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  var bl=breaks.length, gy=jy+621, leapJ=-14, jp=breaks[0], jm,jump,leap,n,march,i;
  for(i=1;i<bl;i+=1){
    jm=breaks[i]; jump=jm-jp;
    if(jy<jm) break;
    leapJ = leapJ + div(jump,33)*8 + div(mod(jump,33),4);
    jp=jm;
  }
  n = jy - jp;
  leapJ = leapJ + div(n,33)*8 + div(mod(n,33)+3,4);
  if(mod(jump,33)===4 && jump-n===4) leapJ += 1;
  var leapG = div(gy,4) - div((div(gy,100)+1)*3,4) - 150;
  march = 20 + leapJ - leapG;
  if(jump-n < 6) n = n - jump + div(jump,33)*33;
  leap = mod(mod(n+1,33)-1,4);
  if(leap===-1) leap=4;
  return {leap:leap, gy:gy, march:march};
}
function j2d(jy,jm,jd){
  var r = jalCal(jy);
  return g2d(r.gy,3,r.march) + (jm-1)*31 - div(jm,7)*(jm-7) + jd - 1;
}
function d2j(jdn){
  var gy = d2g(jdn).gy;
  var jy = gy - 621;
  var r = jalCal(jy);
  var jdn1f = g2d(gy,3,r.march);
  var k = jdn - jdn1f;
  var jm,jd;
  if(k>=0){
    if(k<=185){ jm=1+div(k,31); jd=mod(k,31)+1; return {jy:jy,jm:jm,jd:jd}; }
    else { k -= 186; }
  } else {
    jy -= 1; k += 179;
    if(r.leap===0) k += 1;
  }
  jm = 7 + div(k,30);
  jd = mod(k,30) + 1;
  return {jy:jy,jm:jm,jd:jd};
}
function toJalaali(gy,gm,gd){ return d2j(g2d(gy,gm,gd)); }
function isLeapJalaaliYear(jy){ return jalCal(jy).leap === 0; }
function monthLength(jy,jm){
  if(jm<=6) return 31;
  if(jm<=11) return 30;
  return isLeapJalaaliYear(jy) ? 30 : 29;
}

/* ================= helpers ================= */
var faDigits=['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
function toFa(n){ return String(n).split('').map(function(ch){ return /[0-9]/.test(ch) ? faDigits[+ch] : ch; }).join(''); }
function uid(){ return 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

var monthNames = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
var seasons = [
  { name:"بهار", months:[0,1,2], c1:'--spring-1', c2:'--spring-2', bg:'--spring-bg',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 21c0-6 4-9 8-10-1 6-3 10-8 10Z"/><path d="M12 21c0-6-4-9-8-10 1 6 3 10 8 10Z"/><path d="M12 21V9"/></svg>' },
  { name:"تابستان", months:[3,4,5], c1:'--summer-1', c2:'--summer-2', bg:'--summer-bg',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.3M12 19.2v2.3M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.3M19.2 12h2.3M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>' },
  { name:"پاییز", months:[6,7,8], c1:'--autumn-1', c2:'--autumn-2', bg:'--autumn-bg',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 2 5 5 5 8.5A5 5 0 0 1 12 17a5 5 0 0 1-5-5.5C7 8 9 5 12 3Z"/><path d="M12 17v4"/></svg>' },
  { name:"زمستان", months:[9,10,11], c1:'--winter-1', c2:'--winter-2', bg:'--winter-bg',
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M4 7l16 10M20 7 4 17M2 12h20"/></svg>' }
];
function seasonOf(monthIdx){ return seasons.find(function(s){ return s.months.indexOf(monthIdx) !== -1; }); }

var motivational = ["آفرین! همینطوری ادامه بده","یک قدم نزدیک‌تر شدی","عالی بود، امروز رو بردی","خستگی نداری، فقط پیش برو","امروز رو کامل کردی، خیلی خوبه"];

/* ================= data model =================
   plan[year][ "m-d" ] = { goals: [ {id, text, done}, ... ] }
*/
function migrateEntry(entry){
  if(!entry) return {goals:[]};
  if(entry.goals) return entry;
  var goals = [];
  if(entry.goal || entry.done){
    goals.push({id:uid(), text: entry.goal || '', done: !!entry.done});
  }
  return {goals: goals};
}
function dayStats(entry){
  var goals = (entry && entry.goals) ? entry.goals : [];
  var total = goals.length;
  var done = goals.filter(function(g){ return g.done; }).length;
  return {total:total, done:done};
}
function isDayFullyDone(entry){
  var st = dayStats(entry);
  return st.total>0 && st.done===st.total;
}

/* ================= state ================= */
var today = toJalaali(new Date().getFullYear(), new Date().getMonth()+1, new Date().getDate());
var state = {
  year: today.jy,
  plans: {},
  view: 'home',
  openMonth: 0
};

function planFor(year){
  if(!state.plans[year]) state.plans[year] = {};
  return state.plans[year];
}
function entryFor(year, mi, day){
  var p = planFor(year);
  var k = dayKey(mi, day);
  if(!p[k]) p[k] = {goals:[]};
  return p[k];
}
function dayKey(m,d){ return (m+1)+'-'+d; }

/* ================= storage ================= */
function loadSettings(){
  return window.storage.get('konkur-settings', false).then(function(r){
    if(r && r.value){
      try{ var v = JSON.parse(r.value); if(v.year) state.year = v.year; }catch(e){}
    }
  }).catch(function(){});
}
function saveSettings(){
  window.storage.set('konkur-settings', JSON.stringify({year:state.year}), false).catch(function(){});
}
function loadPlan(year){
  if(state.plans[year]) return Promise.resolve();
  return window.storage.get('konkur-plan-'+year, false).then(function(r){
    var raw = {};
    if(r && r.value){ try{ raw = JSON.parse(r.value); }catch(e){ raw = {}; } }
    var migrated = {};
    Object.keys(raw).forEach(function(k){ migrated[k] = migrateEntry(raw[k]); });
    state.plans[year] = migrated;
  }).catch(function(){ state.plans[year] = {}; });
}
var saveTimer = null;
function savePlan(year){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    window.storage.set('konkur-plan-'+year, JSON.stringify(planFor(year)), false).catch(function(){});
  }, 400);
}

/* ================= rendering ================= */
var $ = function(id){ return document.getElementById(id); };
function getVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function renderHeader(){
  $('yearLabel').textContent = toFa(state.year);
  var isToday = state.year === today.jy;
  $('todayLabel').textContent = isToday ? ('امروز: ' + toFa(today.jd) + ' ' + monthNames[today.jm-1]) : '';

  var curSeason = seasonOf(today.jm-1);
  var hero = $('hero');
  hero.style.background = 'linear-gradient(135deg, ' + getVar(curSeason.c1) + ', ' + getVar(curSeason.c2) + ')';

  var plan = planFor(state.year);
  var doneDays = 0, goalCount = 0;
  Object.keys(plan).forEach(function(k){
    var st = dayStats(plan[k]);
    goalCount += st.total;
    if(isDayFullyDone(plan[k])) doneDays++;
  });
  $('statDone').textContent = toFa(doneDays);
  $('statGoals').textContent = toFa(goalCount);

  var bar = $('seasonBar');
  bar.innerHTML = '';
